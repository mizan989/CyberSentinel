server {
    listen 80;
    server_name _;

    client_max_body_size 5M;

    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://web:5000/static/;
    }

    # -----------------------------------------------------------------
    # HTTPS (recommended for anything beyond localhost demoing):
    # 1. Obtain a cert (e.g. via certbot) and mount it into ./certs
    # 2. Uncomment the block below and the 443 port in docker-compose.yml
    # -----------------------------------------------------------------
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
}
